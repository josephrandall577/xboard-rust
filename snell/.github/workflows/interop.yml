name: interop

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    name: interop with the Go reference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: interop/go.sum

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Go clients against the Rust server
        run: make interop_go_suite

      - name: Rust clients against the Go server
        run: make interop_rust_client
