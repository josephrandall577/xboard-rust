# xboard-snell configuration. A panel is required; users are synchronized from it.

[node]
# Snell v6 listener. The client's Snell server line points here.
listen = "0.0.0.0:6160"
# Clients use their own Xboard user UUID as PSK (unique, 12..=255 bytes).
# Legacy node.psk is optional and ignored. No client userkey is needed.
# Per-user PSK identification requires the default shaped mode.
mode = "default"

[panel]
# Required Xboard panel connection.
# Use HTTPS: remote HTTP exposes the token and user PSKs and emits a warning.
url = "https://panel.example.com"
# Node token created in the panel (server_token, or the machine token).
token = "panel-token"
node_id = 1
# 2 = /api/v2/server/*, 1 = legacy /api/v1/server/UniProxy/*.
api_version = 2
pull_interval = 60
push_interval = 60
# Optional: set by hand if the panel's handshake reports a WebSocket URL.
# ws_url = "wss://panel.example.com/ws"
# machine_id = 1            # machine mode: authenticates as a machine

[admin]
listen = "127.0.0.1:6161"
# Bearer token for the read-only admin API. Empty is allowed only on loopback.
token = ""
# disabled = true            # turn the admin API off entirely

[limits]
# Per-node limits for connections that have not passed authentication.
# Saturation closes new connections immediately; authenticated relays do not count.
max_handshakes = 256
# Raise for clients sharing a NAT, or use 0 to disable the per-IP limit.
max_handshakes_per_ip = 32
# Absolute budget from admission, in seconds (not reset by incoming bytes).
handshake_timeout = 10
# Seconds a source IP keeps counting toward the device limit after its last
# connection closes.
device_ttl = 300
# Refuse new connections for users whose traffic allowance is used up.
enforce_quota = true
# Extra bytes tolerated past the quota.
quota_grace = 0

[storage]
# SQLite file holding users and cumulative traffic counters.
path = "xboard-snell.db"

[log]
level = "info"

# Multi-panel mode uses one process for independent nodes. Copy this file to a
# separate config and remove the legacy [node] and [panel] sections first.
# See config.multi-node.example.toml for a complete working-shape example.
