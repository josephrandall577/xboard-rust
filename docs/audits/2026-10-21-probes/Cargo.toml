[package]
name = "xboard-snell-audit"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
xboard-snell = { path = "../../.." }
snell = { package = "sing-snell", path = "../../../snell" }
tokio = { version = "=1.53.3", features = ["net", "io-util", "rt-multi-thread", "signal", "sync", "time", "macros"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
